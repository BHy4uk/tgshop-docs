site_name: Cartium
site_description: Документація платформи Cartium
site_url: https://docs.cartium.store/

theme:
  name: material
  custom_dir: overrides
  language: uk
  favicon: assets/favicon.svg
  icon:
    logo: cartium/logo
    menu: ph/list
    search: ph/magnifying-glass
    previous: ph/arrow-left
    next: ph/arrow-right
    top: ph/arrow-up
    admonition:
      note: ph/note-pencil
      info: ph/info
      tip: ph/lightbulb
      warning: ph/warning
      question: ph/question
      example: ph/lightning
      success: ph/check-circle
  features:
    - navigation.sections
    - navigation.prune
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.share
    - toc.follow
  # Палітра в стилі cartium.store («soft graphite»): кольори задає styles/extra.css,
  # тут лише дві схеми, які за замовчуванням ідуть за системною темою.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: ph/moon
        name: Темна тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: ph/sun
        name: Світла тема
  # Шрифт Fixel (як на сайті) підключається локально в styles/extra.css
  font: false

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - attr_list
  - md_in_html
  - tables
  # slugify обовʼязковий: без нього кириличні заголовки дають якорі _1, _2…
  # і всі посилання виду #швидкий-старт ламаються
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

extra:
  generator: false   # прибирає "Made with Material"
  # Посилання шапки й підвалу (ті самі, що в cartium-website/src/config.ts)
  site_url_main: https://cartium.store/
  signup_url: https://t.me/cartium_support_bot?start=connect
  bot_url: https://t.me/cartium_support_bot
  bot_handle: cartium_support_bot
  terms_url: https://cartium.work/terms
  privacy_url: https://cartium.work/privacy

extra_css:
  - styles/extra.css

extra_javascript:
  - javascripts/cartium.js

not_in_nav: |
  import.md

exclude_docs: |
  _internal/
  assets/shots/README.md
  ARCHITECTURE_SCALING.md
  PLATFORM_CONTEXT.md
  PRICING_NARRATIVE.md
  README_SELF_HOSTED.md
  TEST_GUIDE.md
  VPS_DEPLOYMENT_UBUNTU.md

nav:
  - Початок: index.md
  - Інструкція для власника: owner-guide.md
  - Запуск магазину: launch.md
  - Оплати: payments.md
  - Нова пошта: nova-poshta.md
