site_name: Telegram-магазин
site_description: Документація платформи
site_url: https://bhy4uk.github.io/tgshop-docs/

theme:
  name: material
  language: uk
  logo: assets/logo.svg
  favicon: assets/favicon.ico
  features:
    - navigation.sections
    - navigation.prune
    - navigation.top
    - header.autohide
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.share
    - toc.follow
  palette:
    - scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-night
        name: Темна тема
    - scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Світла тема
  font:
    text: Manrope
    code: JetBrains Mono
  icon:
    admonition:
      question: material/help-circle-outline

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  # slugify обовʼязковий: без нього кириличні заголовки дають якорі _1, _2…
  # і всі посилання виду #швидкий-старт ламаються
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

extra:
  generator: false   # прибирає "Made with Material"

extra_css:
  - styles/extra.css

exclude_docs: |
  _internal/
  assets/shots/README.md
  ARCHITECTURE_SCALING.md
  PLATFORM_CONTEXT.md
  PRICING_NARRATIVE.md
  README_SELF_HOSTED.md
  TEST_GUIDE.md
  VPS_DEPLOYMENT_UBUNTU.md

nav:
  - Початок: index.md
  - Інструкція для власника: owner-guide.md
  - Запуск магазину: launch.md
  - Оплати: payments.md
  - Нова пошта: nova-poshta.md
